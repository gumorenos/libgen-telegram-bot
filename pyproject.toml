[project]
name = "ebook-telegram-bot-modern"
version = "0.1.0"
description = "Private Telegram bot for searching public-domain ebooks and storing user-owned documents"
requires-python = ">=3.11"
dependencies = [
  "python-telegram-bot[rate-limiter]==22.8",
  "httpx>=0.27,<0.29",
  "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
